name: Build and Generate APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build by clicking a button in GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare Environment
      run: |
        # Generate the missing Gradle wrapper using GitHub's pre-installed Gradle
        gradle wrapper
        chmod +x gradlew
        
        # Create a dummy .env file so the build doesn't fail looking for API keys
        cp .env.example .env

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CropSaathi-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
